services:
  - type: web
    name: amdquant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    domains:
      - amd-quant.com
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: QCHAT_ROLE
        value: gateway
      - key: APP_TOKEN
        generateValue: true
      - key: PUBLIC_DEMO
        value: "1"
      - key: PUBLIC_RATE_LIMIT
        value: "12"
      - key: AMD_API_URL
        sync: false
      - key: AMD_API_TOKEN
        sync: false
