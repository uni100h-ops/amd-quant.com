services:
  engine:
    build:
      context: ..
      dockerfile: amd/Dockerfile
      args:
        ROCM_IMAGE: ${ROCM_IMAGE:-rocm/pytorch:latest}
    restart: unless-stopped
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
    shm_size: 4gb
    env_file:
      - ../.secrets/ibm.env
    environment:
      APP_TOKEN: ${AMD_ENGINE_TOKEN:?Run python3 scripts/setup_amd.py first}
      QCHAT_ROLE: engine
      QCHAT_PROFILE: micro
      MODEL_DIR: /app/dist/models
      QCHAT_DEVICE: cuda
      REQUIRE_AMD: "1"
      QUANTUM_BACKEND: ibm
      STATE_DIR: /state
      MAX_OUTPUT_STEPS: "12"
      COMPARISON_WAIT_SECONDS: "7200"
    volumes:
      - jobs-state:/state
    expose:
      - "8000"
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      AMD_DOMAIN: ${AMD_DOMAIN:?Run python3 scripts/setup_amd.py first}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - engine
volumes:
  jobs-state:
  caddy-data:
  caddy-config:
